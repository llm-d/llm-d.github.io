# Netlify Deploy Previews for PRs opened against *this* website repo.
# Cross-repo docs PR previews from llm-d/llm-d use Actions + `netlify deploy --alias`
# (.github/workflows/docs-pr-preview.yml), not this file.
# Production deploys go to GitHub Pages via .github/workflows/deploy.yml.
[build]
  command = "npm ci && make llmd-site && ./bin/llmd-site sync main && ./bin/llmd-site build"
  publish = "build"

[build.environment]
  GO_VERSION = "1.22"
  NODE_VERSION = "20.18.1"
