name: Docs PR Netlify preview

# Builds the full site with docs synced from an llm-d/llm-d pull request and
# deploys a Netlify draft alias. Triggered by repository_dispatch from
# llm-d/llm-d (event-type: docs-pr-preview).
#
# Secrets (on llm-d/llm-d.github.io):
#   NETLIFY_AUTH_TOKEN       — Netlify personal access token
#   NETLIFY_SITE_ID          — Netlify site ID for this project
#   LLM_D_PR_COMMENT_TOKEN   — fine-grained PAT on llm-d/llm-d with
#     Issues: Read and write (sticky-comments the preview URL and the
#     broken-links report on the docs PR). Optional: if absent, the preview
#     still deploys; URL and report are in the job summary / artifacts.

on:
  repository_dispatch:
    types: [docs-pr-preview]
  workflow_dispatch:
    inputs:
      pr_number:
        description: llm-d/llm-d pull request number
        required: true
        type: string
      sha:
        description: Commit SHA to sync from (defaults to PR head)
        required: false
        type: string
concurrency:
  group: docs-pr-preview-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Netlify preview
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'llm-d/llm-d.github.io' }}
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      sha: ${{ steps.meta.outputs.sha }}
      alias: ${{ steps.meta.outputs.alias }}
    steps:
      - name: Resolve payload
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr_number }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            SHA="${INPUT_SHA:-}"
          else
            PR="$PAYLOAD_PR"
            SHA="${PAYLOAD_SHA:-}"
          fi
          if [ -z "$PR" ]; then
            echo "pr_number is required" >&2
            exit 1
          fi
          PR_HEAD="$(gh api "repos/llm-d/llm-d/pulls/${PR}" --jq '[.head.repo.full_name, .head.sha, .head.ref] | @tsv')"
          IFS=$'\t' read -r HEAD_REPO PR_HEAD_SHA REF <<< "$PR_HEAD"
          if [ -z "$SHA" ]; then
            SHA="$PR_HEAD_SHA"
          fi
          ALIAS="docs-pr-${PR}"
          {
            echo "pr_number=$PR"
            echo "sha=$SHA"
            echo "ref=$REF"
            echo "head_repo=$HEAD_REPO"
            echo "alias=$ALIAS"
          } >> "$GITHUB_OUTPUT"
          echo "Previewing llm-d docs PR #${PR} @ ${HEAD_REPO}@${SHA}"

      - name: Checkout website
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout llm-d PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.head_repo }}
          ref: ${{ steps.meta.outputs.sha }}
          path: _upstream-llm-d
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build llmd-site CLI
        run: make llmd-site

      - name: Run markdown preprocessor tests
        run: make test-preprocess

      - name: Sync docs from PR checkout
        env:
          # Exact SHA tree checked out above; do not fetch/reset.
          LLMD_REPO: ${{ github.workspace }}/_upstream-llm-d
        run: ./bin/llmd-site sync main

      - name: Build site
        run: ./bin/llmd-site build

      # Same as ci-website-test: warn-only so a docs PR still gets a preview.
      # Built-in PR commenting in llmd-site only works for pull_request on this
      # repo; we comment on llm-d/llm-d in the comment job below.
      - name: Check links
        run: ./bin/llmd-site check links --warn-on-broken-links

      - name: Add broken links to job summary
        if: always()
        run: |
          if [ -f broken-links-report.md ]; then
            cat broken-links-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Link check produced no report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-pr-site
          path: build/
          if-no-files-found: error

      - name: Upload broken links report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: broken-links-report
          path: broken-links-report.md
          if-no-files-found: ignore

  deploy:
    name: Deploy Netlify preview
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.netlify.outputs.url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: docs-pr-site
          path: build

      - name: Deploy Netlify alias preview
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          ALIAS: ${{ needs.build.outputs.alias }}
          PR: ${{ needs.build.outputs.pr_number }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets are required on this repo" >&2
            exit 1
          fi
          npx --yes netlify-cli deploy \
            --no-build \
            --dir=build \
            --alias="$ALIAS" \
            --message="docs PR #${PR} (${SHA})" \
            --json > /tmp/netlify-deploy.json
          url="$(python3 -c 'import json; d=json.load(open("/tmp/netlify-deploy.json")); print(d.get("deploy_url") or d.get("url") or "")')"
          if [ -z "$url" ]; then
            site="$(npx --yes netlify-cli api getSite --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name",""))')"
            url="https://${ALIAS}--${site}.netlify.app"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed preview: $url"
          {
            echo "## Docs PR site preview"
            echo ""
            echo "- **PR:** https://github.com/llm-d/llm-d/pull/${PR}"
            echo "- **Docs SHA:** \`${SHA}\`"
            echo "- **Preview:** $url"
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Comment preview URL and link report
    needs: [build, deploy]
    # Still comment the broken-links report if Netlify deploy failed.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download broken links report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: broken-links-report
          path: ${{ runner.temp }}/link-report

      - name: Comment preview URL and broken links on llm-d PR
        env:
          GH_TOKEN: ${{ secrets.LLM_D_PR_COMMENT_TOKEN }}
          PR: ${{ needs.build.outputs.pr_number }}
          URL: ${{ needs.deploy.outputs.url }}
          SHA: ${{ needs.build.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_PATH: ${{ runner.temp }}/link-report/broken-links-report.md
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LLM_D_PR_COMMENT_TOKEN not set; skipping PR comment (URL/report are in the job summary)"
            exit 0
          fi

          upsert_comment() {
            local marker="$1"
            local body_file="$2"
            existing="$(
              gh api "repos/llm-d/llm-d/issues/${PR}/comments" --paginate \
                --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
                | head -n1 || true
            )"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/llm-d/llm-d/issues/comments/${existing}" -F body=@"$body_file"
            else
              gh api -X POST "repos/llm-d/llm-d/issues/${PR}/comments" -F body=@"$body_file"
            fi
          }

          preview_file="$(mktemp)"
          {
            echo '<!-- docs-site-preview -->'
            echo '### Website preview (docs PR)'
            echo ''
            echo "Rendered with this PR's docs synced into [llm-d.github.io](https://github.com/llm-d/llm-d.github.io):"
            echo ''
            if [ -n "${URL:-}" ]; then
              echo "**${URL}**"
            else
              echo "_Netlify deploy did not produce a URL; see the [workflow run](${RUN_URL})._"
            fi
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo "| Docs SHA | \`${SHA}\` |"
            echo "| Build | [workflow run](${RUN_URL}) |"
            echo ''
            echo '_Updated automatically when docs paths change. Not the production GitHub Pages deploy._'
          } > "$preview_file"
          upsert_comment '<!-- docs-site-preview -->' "$preview_file"
          rm -f "$preview_file"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "No broken-links-report.md artifact; skipping link-report comment"
            exit 0
          fi

          report_file="$(mktemp)"
          {
            echo '<!-- check-links-report -->'
            echo '### Broken links report (docs PR preview)'
            echo ''
            echo "From the [docs PR preview build](${RUN_URL}) for \`${SHA}\`."
            echo ''
            # Leave room under GitHub's 65536-char comment limit for the header.
            python3 -c "import pathlib, os; p=pathlib.Path(os.environ['REPORT_PATH']); r=p.read_text(); m=65536-400; print((r if len(r)<=m else r[:m]+'\n\n… _(report truncated)_'), end='')"
          } > "$report_file"
          upsert_comment '<!-- check-links-report -->' "$report_file"
          rm -f "$report_file"
