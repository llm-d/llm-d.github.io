<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="980" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arrGray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
    <marker id="arrBlue2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arrOrange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6834"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL ============ -->
  <text x="245" y="36" text-anchor="middle" fill="#0b0b0b" font-size="16" font-weight="700">Before &#8212; topology-blind pairing</text>

  <rect x="40" y="66" width="190" height="26" rx="5" fill="#52514e"/>
  <text x="135" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5">leaf 4</text>
  <rect x="260" y="66" width="190" height="26" rx="5" fill="#52514e"/>
  <text x="355" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5">leaf 7</text>

  <rect x="40" y="140" width="190" height="160" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="54" y="163" fill="#0b0b0b" font-size="12.5" font-weight="600">host 12</text>
  <rect x="58" y="180" width="64" height="52" rx="6" fill="#eb6834"/>
  <text x="90" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">P</text>
  <rect x="148" y="180" width="64" height="52" rx="6" fill="#1baf7a"/>
  <text x="180" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">D</text>
  <text x="135" y="282" text-anchor="middle" fill="#52514e" font-size="12.5">same host as P</text>

  <rect x="260" y="140" width="190" height="160" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="274" y="163" fill="#0b0b0b" font-size="12.5" font-weight="600">host 2</text>
  <rect x="323" y="180" width="64" height="52" rx="6" fill="#1baf7a"/>
  <text x="355" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">D</text>
  <text x="355" y="282" text-anchor="middle" fill="#52514e" font-size="12.5">cross-leaf</text>

  <!-- equal-weight gray arrows: local direct, far via fabric -->
  <line x1="122" y1="206" x2="142" y2="206" stroke="#898781" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <polyline points="110,180 110,116 355,116 355,174" fill="none" stroke="#898781" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <text x="245" y="330" text-anchor="middle" fill="#52514e" font-size="12.5">pairs P and D as if all endpoints were equal</text>

  <!-- ============ RIGHT PANEL ============ -->
  <text x="735" y="36" text-anchor="middle" fill="#0b0b0b" font-size="16" font-weight="700">After &#8212; topology-scored pairing</text>
  <text x="735" y="54" text-anchor="middle" fill="#898781" font-size="11.5">experimental prototype &#8212; not in an llm-d release</text>

  <rect x="530" y="66" width="190" height="26" rx="5" fill="#52514e"/>
  <text x="625" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5">leaf 4</text>
  <rect x="750" y="66" width="190" height="26" rx="5" fill="#52514e"/>
  <text x="845" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5">leaf 7</text>

  <rect x="530" y="140" width="190" height="160" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="544" y="163" fill="#0b0b0b" font-size="12.5" font-weight="600">host 12</text>
  <rect x="548" y="180" width="64" height="52" rx="6" fill="#eb6834"/>
  <text x="580" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">P</text>
  <rect x="638" y="180" width="64" height="52" rx="6" fill="#1baf7a"/>
  <text x="670" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">D</text>
  <rect x="638" y="244" width="64" height="9" rx="3" fill="#fcfcfb" stroke="#c3c2b7"/>
  <rect x="638" y="244" width="47" height="9" rx="3" fill="#eda100"/>
  <text x="670" y="272" text-anchor="middle" fill="#52514e" font-size="12.5">queue depth</text>

  <rect x="750" y="140" width="190" height="160" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="764" y="163" fill="#0b0b0b" font-size="12.5" font-weight="600">host 2</text>
  <rect x="813" y="180" width="64" height="52" rx="6" fill="#1baf7a"/>
  <text x="845" y="212" text-anchor="middle" fill="#0b0b0b" font-size="15" font-weight="700">D</text>
  <rect x="813" y="244" width="64" height="9" rx="3" fill="#fcfcfb" stroke="#c3c2b7"/>
  <rect x="813" y="244" width="14" height="9" rx="3" fill="#1baf7a"/>
  <text x="845" y="272" text-anchor="middle" fill="#52514e" font-size="12.5">headroom</text>

  <!-- chosen local path: thick blue; spillover: dashed orange via fabric -->
  <line x1="612" y1="206" x2="632" y2="206" stroke="#2a78d6" stroke-width="5" marker-end="url(#arrBlue2)"/>
  <polyline points="600,180 600,116 845,116 845,174" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrOrange)"/>

  <text x="735" y="330" text-anchor="middle" fill="#52514e" font-size="12.5">prefer locality (blue); spill over when saturated (dashed)</text>

  <!-- divider + footer -->
  <line x1="490" y1="30" x2="490" y2="348" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="490" y="378" text-anchor="middle" fill="#52514e" font-size="12.5">Same cluster, same workload &#8212; unconstrained allocation with blind pairing vs topology-scored pairing on the verified channel.</text>
  <text x="490" y="398" text-anchor="middle" fill="#8b8984" font-size="11.5">Diagram shows the production policy (soft score + spillover); the benchmark ran dominant-weight deterministic pairing.</text>
</svg>
