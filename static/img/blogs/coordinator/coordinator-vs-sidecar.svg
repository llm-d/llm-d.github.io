<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460"
     role="img" aria-label="Two-panel comparison. Panel A, sidecar: the Inference Gateway makes one ext_proc call to the EPP, which picks encode, prefill and decode pods up front; the gateway routes the request plus headers to the decode pod, where a sidecar calls the encode pods, then the prefill pod with max_tokens=1, then decodes locally on the transferred KV cache. Panel B, Coordinator: the gateway default-routes to a Coordinator Service running a step pipeline, which calls back into the same gateway once per phase tagged with an EPP-Profile header, so the EPP applies one scheduling profile per phase and the gateway routes each phase to a pod in a single InferencePool with no sidecar.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <rect width="1120" height="460" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     fill="#24292f" stroke="none">

  <!-- ============ panel divider ============ -->
  <line x1="560" y1="18" x2="560" y2="444" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ PANEL A: sidecar ============ -->
  <text x="230" y="30" text-anchor="middle" font-size="15" font-weight="600">A &#183; Sidecar</text>
  <text x="230" y="48" text-anchor="middle" font-size="11" fill="#57606a">one EPP cycle, then headers</text>

  <rect x="175" y="66" width="110" height="28" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="230" y="85" text-anchor="middle" font-size="11">Client</text>

  <line x1="230" y1="94" x2="230" y2="116" stroke="#57606a" marker-end="url(#a)"/>

  <rect x="140" y="118" width="180" height="34" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="230" y="140" text-anchor="middle" font-size="11.5">Inference Gateway</text>

  <line x1="322" y1="135" x2="406" y2="135" stroke="#57606a" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="364" y="128" text-anchor="middle" font-size="10">ext_proc &#215;1</text>

  <rect x="410" y="114" width="110" height="42" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="465" y="140" text-anchor="middle" font-size="12" font-weight="600">EPP</text>
  <text x="465" y="172" text-anchor="middle" font-size="9.5" fill="#57606a">picks E+P+D up front</text>

  <line x1="230" y1="152" x2="230" y2="186" stroke="#bc4c00" marker-end="url(#ao)"/>
  <text x="240" y="173" font-size="9.5" fill="#bc4c00">routes + headers</text>

  <rect x="110" y="190" width="260" height="200" rx="4" fill="#f6f8fa" stroke="#57606a"/>
  <text x="122" y="209" font-size="11">Decode pod</text>

  <rect x="130" y="218" width="220" height="32" rx="3" fill="#ffffff" stroke="#bc4c00"/>
  <text x="240" y="239" text-anchor="middle" font-size="11.5" font-weight="600" fill="#bc4c00">Sidecar</text>

  <!-- 1: encode -->
  <line x1="352" y1="229" x2="406" y2="229" stroke="#57606a" marker-end="url(#a)"/>
  <text x="379" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#bc4c00">1</text>
  <rect x="410" y="214" width="110" height="30" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="465" y="233" text-anchor="middle" font-size="10.5">Encode pods</text>

  <!-- 2: prefill -->
  <polyline points="352,243 385,243 385,303 406,303" fill="none" stroke="#57606a" marker-end="url(#a)"/>
  <text x="392" y="268" font-size="10" font-weight="600" fill="#bc4c00">2</text>
  <text x="392" y="281" font-size="9" fill="#57606a">max_tokens=1</text>
  <rect x="410" y="288" width="110" height="30" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="465" y="307" text-anchor="middle" font-size="10.5">Prefill pod</text>

  <!-- 3: local decode -->
  <line x1="240" y1="250" x2="240" y2="326" stroke="#57606a" marker-end="url(#a)"/>
  <text x="248" y="292" font-size="10" font-weight="600" fill="#bc4c00">3</text>
  <rect x="145" y="328" width="190" height="34" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="240" y="349" text-anchor="middle" font-size="10.5">Local decode</text>

  <!-- KV transfer back into the pod -->
  <polyline points="432,318 432,350 337,350" fill="none" stroke="#57606a" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="385" y="343" text-anchor="middle" font-size="9" fill="#57606a">KV transfer</text>

  <text x="230" y="420" text-anchor="middle" font-size="10" fill="#57606a">orchestration lives on the decode pod</text>
  <text x="230" y="436" text-anchor="middle" font-size="10" fill="#57606a">new concern &#8594; new header + dispatch logic</text>

  <!-- ============ PANEL B: coordinator ============ -->
  <text x="790" y="30" text-anchor="middle" font-size="15" font-weight="600">B &#183; Coordinator</text>
  <text x="790" y="48" text-anchor="middle" font-size="11" fill="#57606a">one EPP call per phase</text>

  <rect x="735" y="66" width="110" height="28" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="790" y="85" text-anchor="middle" font-size="11">Client</text>

  <line x1="790" y1="94" x2="790" y2="116" stroke="#57606a" marker-end="url(#a)"/>

  <rect x="700" y="118" width="180" height="34" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="790" y="140" text-anchor="middle" font-size="11.5">Inference Gateway</text>

  <line x1="882" y1="135" x2="966" y2="135" stroke="#57606a" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="924" y="128" text-anchor="middle" font-size="10">ext_proc &#215;N</text>

  <rect x="970" y="114" width="110" height="42" rx="3" fill="#ffffff" stroke="#57606a"/>
  <text x="1025" y="140" text-anchor="middle" font-size="12" font-weight="600">EPP</text>
  <text x="1025" y="172" text-anchor="middle" font-size="9.5" fill="#57606a">one profile per phase</text>

  <line x1="790" y1="152" x2="790" y2="186" stroke="#57606a" marker-end="url(#a)"/>
  <text x="800" y="173" font-size="9.5" fill="#57606a">default route</text>

  <rect x="680" y="190" width="220" height="50" rx="3" fill="#ffffff" stroke="#0969da"/>
  <text x="790" y="211" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0969da">Coordinator Service</text>
  <text x="790" y="228" text-anchor="middle" font-size="9.5" fill="#57606a">step pipeline</text>

  <!-- the loop: one re-entry into the same gateway per phase -->
  <polyline points="678,215 625,215 625,135 696,135" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="636" y="177" font-size="9.5" fill="#0969da">per phase:</text>
  <text x="636" y="189" font-size="9.5" fill="#0969da">EPP-Profile</text>

  <!-- gateway routes each phase to a pod -->
  <polyline points="882,146 940,146 940,353 904,353" fill="none" stroke="#57606a" marker-end="url(#a)"/>
  <text x="948" y="248" font-size="9.5" fill="#57606a">routes the</text>
  <text x="948" y="260" font-size="9.5" fill="#57606a">picked pod</text>

  <rect x="670" y="328" width="230" height="50" rx="4" fill="#f6f8fa" stroke="#57606a"/>
  <text x="785" y="349" text-anchor="middle" font-size="10.5">Encode &#183; Prefill &#183; Decode pods</text>
  <text x="785" y="365" text-anchor="middle" font-size="9.5" fill="#57606a">one InferencePool &#183; no sidecar</text>

  <text x="790" y="420" text-anchor="middle" font-size="10" fill="#57606a">orchestration lives in front of the gateway</text>
  <text x="790" y="436" text-anchor="middle" font-size="10" fill="#57606a">new concern &#8594; new pipeline step</text>

  </g>
</svg>
